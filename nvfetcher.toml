[wine-latest]
src.cmd = "git ls-remote --tags --refs https://gitlab.winehq.org/wine/wine.git 'wine-*' | sed 's|.*refs/tags/wine-||' | grep -E '^[0-9]+[.][0-9]+([.][0-9]+)?$' | sort -V | tail -n 1"
fetch.tarball = "https://gitlab.winehq.org/wine/wine/-/archive/wine-$ver/wine-wine-$ver.tar.gz"

[crossover-source]
src.manual = "26.3.0"
fetch.url = "https://media.codeweavers.com/pub/crossover/source/crossover-sources-$ver.tar.gz"
