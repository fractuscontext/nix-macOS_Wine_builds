# Time `nix develop` for every Nix installer × store cache combination.
name: Benchmark Nix Setup

on:
  workflow_dispatch:

jobs:
  benchmark:
    name: ${{ matrix.installer }} + ${{ matrix.cache }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        installer: [cachix, determinate, nixbuild, nixos]
        cache: [magic-nix-cache, hestia, cache-nix-action, none]

    steps:
      - uses: actions/checkout@v7

      - if: matrix.installer == 'cachix'
        uses: cachix/install-nix-action@v31

      - if: matrix.installer == 'determinate'
        uses: DeterminateSystems/nix-installer-action@main

      - if: matrix.installer == 'nixbuild'
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - if: matrix.installer == 'nixos'
        uses: NixOS/nix-installer-action@main

      - if: matrix.cache == 'magic-nix-cache'
        uses: DeterminateSystems/magic-nix-cache-action@main

      - if: matrix.cache == 'hestia'
        uses: Mic92/hestia@v3

      - if: matrix.cache == 'cache-nix-action'
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-macos-${{ hashFiles('**/*.nix') }}
          restore-prefixes-first-match: nix-macos-
          gc-max-store-size-macos: 2G
          purge: true
          purge-prefixes: nix-macos-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Time nix develop
        run: time nix --extra-experimental-features "nix-command flakes" develop --command true
