# Download a CI ccache as an artifact, e.g. to seed a local .ccache.
name: Export ccache

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: "Exact cache key (e.g. macOS-ccache-123456-1)"
        required: true
        type: string

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true

      - uses: actions/upload-artifact@v7
        with:
          name: ccache-${{ inputs.cache_key }}
          include-hidden-files: true
          path: .ccache
          retention-days: 7
