# CrossOver has no upstream feed, so its version is pinned by hand here.
name: Update CrossOver

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CrossOver version (e.g. 26.3.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@v35
      - uses: Mic92/hestia@v3

      # Wine Mono has to match MONO_VERSION in the new source, so it is read from the
      # pinned tree rather than typed in
      - name: Update Pins
        run: |
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "Not a version: $VERSION"; exit 1; }
          retry() {
            for i in {1..5}; do
              "$@" && return 0
              echo "$*: attempt $i/5 failed, retrying in 10 seconds..." >&2
              sleep 10
            done
            return 1
          }

          nix develop --command just pin crossover-source "$VERSION"
          retry nix develop --command just update-source crossover-source

          src=$(retry nix build --no-link --print-out-paths .#source-crossover)
          mono=$(sed -n 's/^#define MONO_VERSION "\(.*\)"$/\1/p' "$src/dlls/appwiz.cpl/addons.c")
          [ -n "$mono" ] || { echo "No MONO_VERSION in CrossOver $VERSION"; exit 1; }
          echo "MONO_VERSION=$mono" >> "$GITHUB_ENV"
          nix develop --command just pin wine-mono-crossover "$mono"
          retry nix develop --command just update-source wine-mono-crossover

      # Keep `nix develop` from installing pre-commit hooks that would run on the bot's commit
      - name: Disable Git Hooks
        run: git config core.hooksPath /dev/null

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: update/crossover-${{ inputs.version }}
          title: "Update CrossOver to ${{ inputs.version }}"
          commit-message: "chore(sources): bump crossover to ${{ inputs.version }}"
          body: >-
            Pins CrossOver `${{ inputs.version }}` in `nvfetcher.toml` and regenerates its source
            hash, with Wine Mono `${{ env.MONO_VERSION }}` to match its MONO_VERSION.
