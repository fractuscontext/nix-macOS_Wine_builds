name: Setup build environment
description: Nix, binary cache, ccache and a warm dev shell

inputs:
  trusted:
    description: >-
      "false" for builds of PR code: caches are only restored, never saved,
      so they can't be poisoned for release builds.
    default: "true"

outputs:
  ccache-key:
    description: Key to save .ccache under with actions/cache/save
    value: ${{ steps.ccache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - uses: nixbuild/nix-quick-install-action@v35

    - if: inputs.trusted == 'true'
      uses: Mic92/hestia@v3

    # Saved by the calling workflow (actions/cache/save, if: always()), so a failed
    # build still keeps its ccache; the combined actions/cache only saves on success
    - id: ccache
      uses: actions/cache/restore@v6
      with:
        path: .ccache
        key: ${{ runner.os }}-ccache-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ runner.os }}-ccache-

    - name: Preheat Nix Environment
      shell: bash
      run: nix develop --command true
